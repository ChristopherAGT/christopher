<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domino's Login</title>

<script src="usuarios.js"></script>

<style>

html, body{
height:100%;
margin:0;
padding:0;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
font-family:'Segoe UI',sans-serif;

/* PALETA DOMINOS */

background:linear-gradient(135deg,#e31837,#006491);
color:white;
overflow:hidden;
}

/* LOGO DE FONDO */

body::before{
content:"";
position:fixed;
top:50%;
left:50%;
width:650px;
height:650px;
background:url("https://upload.wikimedia.org/wikipedia/commons/7/74/Dominos_pizza_logo.svg") center/contain no-repeat;
opacity:0.08;
transform:translate(-50%,-50%);
pointer-events:none;
}

.container{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:white;
color:#111;

padding:40px 30px;
border-radius:20px;
width:100%;
max-width:420px;

box-shadow:0 25px 60px rgba(0,0,0,0.35);
text-align:center;
}

h2{
color:#006491;
margin-bottom:25px;
letter-spacing:1px;
font-weight:800;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
background:#f5f5f5;
color:#111;
font-size:14px;
outline:none;
transition:0.3s;
}

input:focus{
border-color:#006491;
box-shadow:0 0 0 2px rgba(0,100,145,0.2);
}

button{
width:100%;
padding:13px;
border-radius:12px;
border:none;
margin-top:15px;

background:#006491;
color:white;

font-weight:bold;
font-size:15px;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#004f74;
transform:translateY(-2px);
}

.error{
color:#e31837;
font-size:13px;
margin-top:8px;
}

.logo{
width:70px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

<img class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/7/74/Dominos_pizza_logo.svg">

<h2>Iniciar Sesión</h2>

<input type="text" id="nombre" name="usuario" placeholder="Agente" autocomplete="off">

<input type="password" id="password" name="clave" placeholder="Contraseña" autocomplete="off">

<button onclick="login()">Ingresar</button>

<div class="error" id="error"></div>

</div>

<script>

function login(){

const nombre=document.getElementById("nombre").value.trim();
const password=document.getElementById("password").value;
const errorDiv=document.getElementById("error");

const usuario=usuarios.find(u=>u.nombre===nombre && u.password===password);

if(usuario){

localStorage.setItem("usuario",nombre);
window.location.href="index.html";

}else{

errorDiv.textContent="Nombre o contraseña incorrectos";

}

}

</script>

</body>
</html>
