<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domino's Calculadora</title>

<script>
const usuario = localStorage.getItem("usuario");
if(!usuario){
window.location.href = "login.html";
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#e31837,#006491);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
overflow:hidden;
}
body::before{
content:"";
position:fixed;
top:50%;
left:50%;
width:600px;
height:600px;
background:url("https://upload.wikimedia.org/wikipedia/commons/7/74/Dominos_pizza_logo.svg") center/contain no-repeat;
opacity:0.08;
transform:translate(-50%,-50%);
pointer-events:none;
}
.container{
background:white;
color:#111;
padding:35px 30px;
border-radius:20px;
width:100%;
max-width:420px;
box-shadow:0 25px 60px rgba(0,0,0,0.35);
}
h1{
text-align:center;
margin-bottom:25px;
color:#006491;
font-weight:800;
}
.input-group{
margin-bottom:18px;
display:flex;
flex-direction:column;
}
label{
font-size:13px;
margin-bottom:6px;
color:#555;
}
input{
padding:12px;
border-radius:10px;
border:1px solid #ddd;
background:#f8f8f8;
font-size:14px;
}
button{
width:100%;
padding:13px;
border-radius:12px;
border:none;
margin-top:12px;
background:#006491;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
}
button:hover{opacity:0.9;}
.btn-rojo{background:#e31837;}
.btn-gris{background:#6b7280;}

.lista{
list-style:none;
padding:0;
margin:5px 0;
}
.lista li{
display:flex;
justify-content:space-between;
padding:6px 0;
font-size:14px;
border-bottom:1px solid rgba(0,0,0,0.05);
}

.resultado{
font-weight:bold;
font-size:14px;
margin-bottom:10px;
padding:10px 12px;
border-radius:10px;
text-align:center;
color:white;
}
.verde{background:#16a34a;}
.amarillo{background:#f59e0b;}
.rojo{background:#e31837;}

.floating-btn{
position:fixed;
bottom:20px;
right:20px;
width:50px;
height:50px;
border-radius:50%;
background:#006491;
color:white;
font-size:22px;
border:none;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:380px;
max-width:95%;
background:white;
color:#111;
padding:25px;
border-radius:20px;
display:none;
z-index:1001;
overflow:hidden;
}

.popup::before{
content:"";
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:220px;
height:220px;
background:url("https://upload.wikimedia.org/wikipedia/commons/7/74/Dominos_pizza_logo.svg") center/contain no-repeat;
opacity:0.06;
}

.popup *{position:relative;z-index:2;}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
display:none;
z-index:1000;
}

.fecha{
font-size:12px;
margin-bottom:5px;
text-align:right;
}
.fecha strong{color:#006491;}
</style>
</head>

<body>

<div class="container">

<h1>🍕 DOMINO'S PIZZA</h1>

<div class="input-group">
<label>Total de Órdenes</label>
<input type="number" id="ordenes">
</div>

<div class="input-group">
<label>Total de Adicionales</label>
<input type="number" id="adicionales">
</div>

<div class="input-group">
<label>Total de Llamadas</label>
<input type="number" id="llamadas">
</div>

<div class="input-group">
<label>Ventas (Q)</label>
<input type="number" id="ventas">
</div>

<div class="input-group">
<label>Tiempo en Llamadas (mm:ss)</label>
<input type="text" id="tiempo" placeholder="ej. 03:20">
</div>

<button onclick="calcular()">Calcular</button>
<button class="btn-rojo" onclick="limpiarDatos()">Limpiar Datos</button>
<button class="btn-rojo" onclick="cerrarSesion()">Cerrar Sesión</button>

</div>

<button class="floating-btn" onclick="mostrarFormulas()">❔</button>

<div class="overlay" id="overlay" onclick="cerrarPopup()"></div>

<div class="popup" id="popup">

<div id="contenido"></div>

<button onclick="exportarPDF()">Exportar PDF</button>
<button class="btn-gris" onclick="copiarTexto()">Copiar</button>
<button class="btn-rojo" onclick="cerrarPopup()">Cerrar</button>

</div>

<script>

function formatoTiempo(segundos){
let min=Math.floor(segundos/60);
let sec=segundos%60;
return String(min).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}

function formatoMoneda(valor){
return valor.toLocaleString('es-GT',{style:'currency',currency:'GTQ'});
}

function colorClase(valor){
if(valor>=70)return'verde';
if(valor>=40)return'amarillo';
return'rojo';
}

function limpiarDatos(){
document.querySelectorAll("input").forEach(i=>i.value="");
}

function fechaHoy(){
return new Date().toLocaleDateString('es-GT',{year:'numeric',month:'long',day:'numeric'});
}

let datosReporte={};

function calcular(){

let ordenes=parseFloat(document.getElementById("ordenes").value)||0;
let adicionales=parseFloat(document.getElementById("adicionales").value)||0;
let llamadas=parseFloat(document.getElementById("llamadas").value)||0;
let ventas=parseFloat(document.getElementById("ventas").value)||0;

let tiempoInput=document.getElementById("tiempo").value||"00:00";
let partes=tiempoInput.split(":");
let tiempo=0;

if(partes.length===2){
tiempo=parseInt(partes[0])*60+parseInt(partes[1]);
}

let conversion=llamadas>0?Math.round((ordenes/llamadas)*100):0;
let adicionalesPorcentaje=ordenes>0?Math.round((adicionales/ordenes)*100):0;
let eficiencia=Math.round((conversion+adicionalesPorcentaje)/2);
let ticket=ordenes>0?(ventas/ordenes):0;

const usuario=localStorage.getItem("usuario")||"Usuario";

datosReporte={
usuario,
ordenes,
adicionales,
llamadas,
ventas,
ticket,
tiempo:formatoTiempo(tiempo),
conversion,
adicionalesPorcentaje,
eficiencia
};

document.getElementById("contenido").innerHTML=`
<div class="fecha"><strong>Agente:</strong> ${usuario}</div>
<div class="fecha"><strong>Fecha:</strong> ${fechaHoy()}</div>

<h3>Información</h3>

<ul class="lista">
<li><span>Total de Órdenes</span><span>${ordenes}</span></li>
<li><span>Total de Adicionales</span><span>${adicionales}</span></li>
<li><span>Total de Llamadas</span><span>${llamadas}</span></li>
<li><span>Total de Ventas</span><span>${formatoMoneda(ventas)}</span></li>
<li><span>Ticket Promedio</span><span>${formatoMoneda(ticket)}</span></li>
<li><span>Tiempo (AHT)</span><span>${formatoTiempo(tiempo)}</span></li>
</ul>

<hr>

<h3>Resultados</h3>

<div class="resultado ${colorClase(conversion)}">📈 Conversión: ${conversion}%</div>
<div class="resultado ${colorClase(adicionalesPorcentaje)}">➕ Adicionales: ${adicionalesPorcentaje}%</div>
<div class="resultado ${colorClase(eficiencia)}">⚡ Eficiencia: ${eficiencia}%</div>
`;

popup.style.display='block';
overlay.style.display='block';
}

function generarTexto(){

let r=datosReporte;

return `> *DOMINO'S REPORTE*

👤 *Agente:* ${r.usuario}
📅 *Fecha:* ${fechaHoy()}

📊 *INFORMACIÓN*
• *Órdenes:* ${r.ordenes}
• *Adicionales:* ${r.adicionales}
• *Llamadas:* ${r.llamadas}
• *Ventas:* ${formatoMoneda(r.ventas)}
• *Ticket Promedio:* ${formatoMoneda(r.ticket)}
• *AHT:* ${r.tiempo}

📈 *RESULTADOS*
• *Conversión:* ${r.conversion}%
• *Adicionales:* ${r.adicionalesPorcentaje}%
• *Eficiencia:* ${r.eficiencia}%

> *FIN*`;
}

function copiarTexto(){

navigator.clipboard.writeText(generarTexto()).then(()=>{

let aviso=document.createElement("div");

aviso.innerText="✅ Reporte copiado";

aviso.style.position="fixed";
aviso.style.bottom="20px";
aviso.style.left="50%";
aviso.style.transform="translateX(-50%)";
aviso.style.background="#16a34a";
aviso.style.color="white";
aviso.style.padding="10px 18px";
aviso.style.borderRadius="10px";
aviso.style.fontSize="14px";
aviso.style.zIndex="2000";

document.body.appendChild(aviso);

setTimeout(()=>{aviso.remove();},2000);

}).catch(()=>{
alert("No se pudo copiar el reporte");
});
}

function mostrarFormulas(){

document.getElementById("contenido").innerHTML=`
<h3>Fórmulas</h3>

<ul class="lista">
<li>Conversión = (Órdenes ÷ Llamadas) × 100</li>
<li>Adicionales = (Adicionales ÷ Órdenes) × 100</li>
<li>Eficiencia = (Conversión + Adicionales) ÷ 2</li>
<li>Ticket Promedio = Ventas ÷ Órdenes</li>
</ul>
`;

popup.style.display='block';
overlay.style.display='block';

}

function cerrarPopup(){
popup.style.display='none';
overlay.style.display='none';
}

function cerrarSesion(){
localStorage.removeItem("usuario");
window.location.href="login.html";
}

async function exportarPDF(){

const { jsPDF } = window.jspdf;

let area=document.getElementById("contenido");

const canvas=await html2canvas(area);

const img=canvas.toDataURL("image/png");

const pdf=new jsPDF();

pdf.addImage(img,'PNG',10,10,180,0);

pdf.save("reporte_dominos.pdf");

}

</script>

</body>
</html>
